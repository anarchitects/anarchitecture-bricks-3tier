    select="[anxSlot='header'], [anxHeader], [anxCardHeader]"
  ></ng-content>
</header>

<section class="anx-card__body" data-anx-slot="content">
  <ng-content select="[anxSlot='content']"></ng-content>

</section>

<footer class="anx-card__footer anx-text" data-anx-slot="footer">
  <ng-content
    select="[anxSlot='footer'], [anxFooter], [anxCardFooter]"
  ></ng-content>
</footer>
