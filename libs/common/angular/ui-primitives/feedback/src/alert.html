<span class="anx-alert__slot anx-alert__slot--start" data-anx-slot="start">
  <ng-content
    select="[anxSlot='start'], [anxSlot='prefix'], [anxStart]"
  ></ng-content>
</span>

<span class="anx-alert__content" data-anx-slot="content">
  <ng-content select="[anxSlot='content']"></ng-content>
  <ng-content></ng-content>
</span>

<span class="anx-alert__actions anx-inline" data-anx-slot="actions">
  <ng-content select="[anxSlot='actions'], [anxActions]"></ng-content>

  @if (dismissible()) {
  <button
    type="button"
    class="anx-alert__dismiss"
    (click)="onDismiss()"
    aria-label="Dismiss"
  >
    x
  </button>
  }
</span>
