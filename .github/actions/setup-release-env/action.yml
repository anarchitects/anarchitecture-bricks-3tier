name: Setup Release Environment
description: Install release workflow dependencies

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: yarn
        registry-url: https://registry.npmjs.org/

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Validate domain tags
      shell: bash
      run: node tools/release/validate-domain-tags.mjs
