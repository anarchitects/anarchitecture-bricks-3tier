name: Setup Release Environment
description: Install release workflow dependencies

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  working-directory:
    description: Checked-out workspace to prepare
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
        registry-url: https://registry.npmjs.org/

    - name: Cache Yarn packages
      uses: actions/cache@v4
      with:
        path: ~/.yarn/berry/cache
        key: release-yarn-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --immutable

    - name: Validate domain tags
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node tools/release/validate-domain-tags.mjs

    - name: Validate Angular package release coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn nx run release-tools:validate-angular-package-compatibility
