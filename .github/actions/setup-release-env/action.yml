name: Setup Release Environment
description: Checkout the repository and install release workflow dependencies

inputs:
  checkout-token:
    description: Optional token used for repository checkout
    required: false
    default: ''
  node-version:
    description: Node.js version to use
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Checkout repository with custom token
      if: ${{ inputs.checkout-token != '' }}
      uses: actions/checkout@v5
      with:
        token: ${{ inputs.checkout-token }}
        fetch-depth: 0
        filter: tree:0

    - name: Checkout repository
      if: ${{ inputs.checkout-token == '' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: yarn
        registry-url: https://registry.npmjs.org/

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    - name: Validate domain tags
      shell: bash
      run: node tools/release/validate-domain-tags.mjs
