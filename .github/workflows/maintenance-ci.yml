name: Maintenance PR CI

on:
  pull_request:
    branches: [maint/nest-11]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NX_NO_CLOUD: 'true'
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --immutable
      - name: Validate maintenance backport eligibility
        run: yarn nx run release-tools:check-maintenance-backport
        env:
          MAINTENANCE_BASE_REF: ${{ github.base_ref }}
          MAINTENANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAINTENANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAINTENANCE_PR_TITLE: ${{ github.event.pull_request.title }}

  packed:
    uses: ./.github/workflows/nest-compatibility.yml

  maintenance:
    if: always()
    needs: [policy, packed]
    runs-on: ubuntu-latest
    steps:
      - name: Require policy and the complete packed matrix
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          PACKED_RESULT: ${{ needs.packed.result }}
        run: test "$POLICY_RESULT" = success && test "$PACKED_RESULT" = success
