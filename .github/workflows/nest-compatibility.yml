name: Packed Nest compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'libs/auth/**'
      - 'libs/forms/**'
      - 'libs/identity/**'
      - 'libs/newsletter/**'
      - 'libs/common/nest/**'
      - 'examples/newsletter-nest-example/**'
      - 'tools/testing/**'
      - 'tools/release/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'nx.json'
      - 'tsconfig*.json'
      - '.github/workflows/nest-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: nest-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packed-hosts:
    name: ${{ matrix.suite }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node 20 omits Auth (Kysely >=22). Nest 12's file-type also needs >=22.
          - { node: '20.19.0', suite: nest11 }
          - { node: '22.13.0', suite: nest11 }
          - { node: '22.13.0', suite: nest12 }
          - { node: '24.11.0', suite: nest11 }
          - { node: '24.11.0', suite: nest12 }
          - { node: '26.11.1', suite: nest11 }
          - { node: '26.11.1', suite: nest12 }
    env:
      NX_NO_CLOUD: 'true'
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v5
      - name: Install consumer runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # Corepack is enabled after both runtime installations. Cache Yarn
          # explicitly below so setup-node never probes the runner's Yarn 1.
          package-manager-cache: false
      - name: Record consumer executable
        run: echo "NEST_HOST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Install workspace tooling runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: nest-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - name: Configure Docker Hub cache
        run: |
          sudo mkdir -p /etc/docker
          if [ ! -f /etc/docker/daemon.json ]; then
            echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
          fi
          sudo jq '."registry-mirrors" = (["https://mirror.gcr.io"] + (."registry-mirrors" // []) | unique)' \
            /etc/docker/daemon.json > "$RUNNER_TEMP/docker-daemon.json"
          sudo install -m 644 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: Build, validate packed contracts, and run isolated hosts
        env:
          NEST_HOST_NPM_CACHE: ${{ runner.temp }}/nest-host-npm-cache
        run: |
          set -o pipefail
          yarn nx run release-tools:test-nest-compatibility:${{ matrix.suite }} --output-style=static 2>&1 | tee "$RUNNER_TEMP/nest-hosts.log"
      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nest-hosts-${{ matrix.suite }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/nest-hosts.log
          retention-days: 7
