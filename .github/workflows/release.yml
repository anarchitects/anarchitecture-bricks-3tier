name: Release (Manual)

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain release group to release
        required: true
        type: choice
        options:
          - forms
          - auth
          - common

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow must run from main. Current ref: ${{ github.ref }}"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate domain tags
        run: node tools/release/validate-domain-tags.mjs

      - name: Run release for selected domain group
        run: yarn nx release --groups=${{ inputs.domain }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
