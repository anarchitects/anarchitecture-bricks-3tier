name: Release (Manual)

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain release group to release
        required: true
        type: choice
        options:
          - forms
          - auth
          - identity
          - common
      bump:
        description: Optional semver override for the selected domain release
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      first_release:
        description: Treat the selected release as a first release when one or more projects have no prior release tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow must run from main. Current ref: ${{ github.ref }}"
          exit 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ANARCHITECTS_BOT_APP_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          filter: tree:0

      - name: Prepare release workspace
        uses: ./.github/actions/setup-release-env

      - name: Configure git author for release commits
        run: |
          git config user.name "anarchitects-bot[bot]"
          git config user.email "anarchitects-bot[bot]@users.noreply.github.com"

      - name: Run release for selected domain group
        run: |
          bump_args=""
          first_release_args=""
          if [ -n "${{ inputs.bump }}" ]; then
            bump_args="--bump=${{ inputs.bump }}"
          fi
          if [ "${{ inputs.first_release }}" = "true" ]; then
            first_release_args="--first-release"
          fi
          yarn nx run release-tools:domain-release -- --domain=${{ inputs.domain }} $bump_args $first_release_args --skip-publish --yes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
