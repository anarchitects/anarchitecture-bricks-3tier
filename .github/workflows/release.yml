name: Release (Manual)

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain release group to release
        required: true
        type: choice
        options:
          - forms
          - auth
          - common

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow must run from main. Current ref: ${{ github.ref }}"
          exit 1

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ANARCHITECTS_BOT_APP_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          filter: tree:0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate domain tags
        run: node tools/release/validate-domain-tags.mjs

      - name: Configure git author for release commits
        run: |
          git config user.name "anarchitects-bot[bot]"
          git config user.email "anarchitects-bot[bot]@users.noreply.github.com"

      - name: Run release for selected domain group
        run: yarn nx run release-tools:domain-release -- --domain=${{ inputs.domain }} --yes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
