name: Auth passkey contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'libs/auth/**'
      - 'libs/forms/**'
      - 'libs/common/nest/mailer/**'
      - 'libs/common/tailwind/**'
      - 'examples/auth-angular-example/**'
      - 'examples/auth-angular-example-e2e/**'
      - 'tools/testing/passkey-contract-host.mjs'
      - 'docs/guides/auth-passkeys.md'
      - 'package.json'
      - 'yarn.lock'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/auth-passkey-contracts.yml'

permissions:
  contents: read

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - run: yarn nx run auth-angular-example-e2e:typecheck
      - run: yarn nx run auth-angular-example-e2e:passkey-contract-test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: auth-passkey-contract-traces
          path: dist/.playwright/auth-passkey-contracts
          retention-days: 7
