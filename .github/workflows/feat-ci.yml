name: Feature CI
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  pull_request:
    branches:
      - feat/**

permissions:
  actions: read
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - run: corepack enable

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      - run: yarn dlx nx start-ci-run --distribute-on=".nx/workflows/distribution-config.yaml" --stop-agents-after="contract-test"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'yarn'

      - uses: nrwl/nx-set-shas@v4

      - run: yarn install --immutable
      - run: yarn nx-cloud record -- yarn nx run api-specs:lint
      - run: yarn nx-cloud record -- yarn nx run angular-docs:generate
      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      - run: yarn nx-cloud record -- yarn nx format:check
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: yarn nx affected -t lint test build
      - run: yarn nx-cloud record -- yarn nx run-many -t contract-test --projects=forms-nest-example,forms-angular-example
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-preview
          path: |
            docs/openapi
            dist/docs/compodoc
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: yarn nx fix-ci
        if: always()
