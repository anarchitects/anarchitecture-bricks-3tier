name: Publish Packages (Recovery)

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-recovery
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This recovery workflow must run from main. Current ref: ${{ github.ref }}"
          exit 1

      - name: Prepare publish workspace
        uses: ./.github/actions/setup-release-env

      - name: Build release artifacts
        run: yarn nx run-many -t build --skip-nx-cache

      - name: Publish packages
        run: yarn nx release publish --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
