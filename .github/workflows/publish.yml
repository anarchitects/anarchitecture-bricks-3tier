name: Publish

on:
  release:
    types:
      - published
  repository_dispatch:
    types:
      - publish-package
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable project@version tag to publish or retry
        required: true
        type: string

env:
  NX_NO_CLOUD: 'true'
  NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

permissions:
  contents: read

jobs:
  # Release events load workflow YAML from the tagged commit. Relay them to the
  # default branch; only the main-controlled job below receives OIDC permission.
  route-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Generate release relay token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ANARCHITECTS_BOT_APP_ID }}
          private-key: ${{ secrets.ANARCHITECTS_BOT_PRIVATE_KEY }}
      - name: Request publishing on main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n --arg tag "$RELEASE_TAG" '{event_type: "publish-package", client_payload: {tag: $tag}}' |
            gh api --method POST "repos/$REPOSITORY/dispatches" --input -

  select-package:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.project.outputs.project }}
    steps:
      - name: Select a safe concurrency key
        id: project
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          project="${RELEASE_TAG%@*}"
          [[ "$project" =~ ^[a-z][a-z0-9-]*$ ]] || exit 1
          echo "project=$project" >> "$GITHUB_OUTPUT"

  publish:
    needs: select-package
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-${{ needs.select-package.outputs.project }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      - name: Ensure publish workflow runs from main
        working-directory: .
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main

      - name: Checkout immutable workflow control code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare control workspace
        uses: ./control/.github/actions/setup-release-env
        with:
          working-directory: control
          node-version: '24'

      - name: Validate tag, package and release line
        id: tag
        working-directory: control
        run: node tools/release/release-route.mjs tag

      - name: Checkout immutable package source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare publish workspace using main action
        uses: ./control/.github/actions/setup-release-env
        with:
          working-directory: source
          node-version: '24'

      - name: Build and test project
        env:
          PROJECT: ${{ steps.tag.outputs.project }}
        run: |
          yarn nx build "$PROJECT" --skip-nx-cache
          yarn nx test "$PROJECT" --skip-nx-cache

      - name: Validate packed artifact and publish executor
        run: node ../control/tools/release/release-route.mjs artifact
        env:
          CANDIDATE_SHA: ${{ steps.tag.outputs.sha }}
          CANDIDATE_TAG_OBJECT: ${{ steps.tag.outputs.tagObject }}

      - name: Check immutable registry version and prevent dist-tag rollback
        id: registry
        run: node ../control/tools/release/release-route.mjs registry
        env:
          CANDIDATE_SHA: ${{ steps.tag.outputs.sha }}
          CANDIDATE_TAG_OBJECT: ${{ steps.tag.outputs.tagObject }}

      - name: Publish project through npm Trusted Publisher
        if: steps.registry.outputs.decision == 'publish'
        env:
          NPM_CONFIG_PROVENANCE: true
          PROJECT: ${{ steps.tag.outputs.project }}
          DIST_TAG: ${{ steps.tag.outputs.distTag }}
        run: yarn nx release publish --projects "$PROJECT" --tag "$DIST_TAG" --yes

      - name: Validate Tailwind registry release
        if: steps.tag.outputs.project == 'tailwind'
        run: yarn nx run release-tools:validate-tailwind-registry --skip-nx-cache
        env:
          ANARCHITECTS_TAILWIND_VERSION: ${{ steps.tag.outputs.version }}

      - name: Validate Tailwind registry package in Angular consumers
        if: steps.tag.outputs.project == 'tailwind'
        run: yarn nx run angular-consumer-compatibility:test-22 --skip-nx-cache
        env:
          ANARCHITECTS_TAILWIND_VERSION: ${{ steps.tag.outputs.version }}
          NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
