                  additionalProperties: {}
                  type: object
              required:
                - formId
                - formVersion
                - payload
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  createdAt:
                    format: date-time
                    type: string
                  formId:
                    type: string
                  formVersion:
                    minimum: 1
                    type: integer
                  id:
                    type: string
                  payload:
                    additionalProperties: {}
                    type: object
                  updatedAt:
                    format: date-time
                    type: string
                required:
                  - id
                  - formId
                  - formVersion
                  - payload
                  - createdAt
                  - updatedAt
                type: object
          description: Default Response
      tags:
        - Forms
servers:
