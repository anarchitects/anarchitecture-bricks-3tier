              properties:
                newEmail:
                  format: email
                  type: string
                password:
                  minLength: 6
                  type: string
              required:
                - newEmail
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  minLength: 1
                  type: string
              required:
                - token
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
