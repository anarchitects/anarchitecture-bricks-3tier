              required:
                - refreshToken
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/me:
    get:
      operationId: getLoggedInUserInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  rbac:
                    items: {}
                    type: array
                  user: {}
                required:
                  - user
                  - rbac
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/refresh-tokens/{userId}:
    post:
      operationId: refreshTokens
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refreshToken:
                  minLength: 1
                  type: string
              required:
