                type: object
          description: Default Response
      tags:
        - Auth
  /auth/register:
    post:
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                confirmPassword:
                  minLength: 6
                  type: string
                email:
                  format: email
                  type: string
                password:
                  minLength: 6
                  type: string
                userName:
                  maxLength: 100
                  minLength: 2
                  type: string
              required:
                - email
                - password
                - confirmPassword
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
