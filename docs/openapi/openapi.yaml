openapi: 3.1.0
paths:
  /auth/activate:
    patch:
      operationId: activateUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  minLength: 1
                  type: string
              required:
                - token
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/change-password/{userId}:
    patch:
      operationId: changePassword
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                confirmPassword:
                  minLength: 6
                  type: string
                currentPassword:
                  minLength: 6
                  type: string
                newPassword:
                  minLength: 6
                  type: string
              required:
                - currentPassword
                - newPassword
                - confirmPassword
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  format: email
                  type: string
              required:
                - email
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                required:
                  - success
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              properties:
                credential:
                  maxLength: 100
                  minLength: 2
                  type: string
                password:
                  minLength: 6
                  type: string
              required:
                - credential
                - password
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    minLength: 1
                    type: string
                  refreshToken:
                    minLength: 1
                    type: string
                required:
                  - accessToken
                  - refreshToken
                type: object
          description: Default Response
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              properties:
                accessToken:
                  minLength: 1
                  type: string
                refreshToken:
                  minLength: 1
