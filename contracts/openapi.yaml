openapi: 3.1.0
info:
  title: Anarchitecture 3Tier Contracts
  version: 0.1.0
  description: Source of truth for sync HTTP APIs. Libraries in TS/Rails/Laravel MUST comply.
  contact:
    name: Anarchitects Team
    url: https://github.com/anarchitects/anarchitecture-bricks-3tier
    email: info@anarchitects.dev
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
tags:
  - name: Health
  - name: Contacts
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts
      operationId: listContacts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: List of contacts
          headers:
            X-Total-Count:
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Contacts]
      summary: Create contact
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        default:
          $ref: '#/components/responses/Problem'
  /contacts/{id}:
    get:
      tags: [Contacts]
      summary: Get a contact
      operationId: getContact
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Contacts]
      summary: Delete a contact
      operationId: deleteContact
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string, description: 'ULID/UUID' }
    page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    sort:
      in: query
      name: sort
      description: 'Comma-separated fields. Prefix with "-" for desc. Example: name,-createdAt'
      schema: { type: string }
  responses:
    Problem:
      description: Error response (Problem Details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
      required: [title, status]
    Contact:
      type: object
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        message: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, createdAt]
    ContactCreate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        message: { type: string, minLength: 1 }
      required: [name, email, message]
