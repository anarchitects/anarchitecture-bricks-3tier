<main class="layout">
  <header class="header">
    <p class="eyebrow">Auth Showcase</p>
    <h1>Auth Angular Example</h1>
    @if (store.isLoggedIn()) {
      <p class="status success">Logged in: {{ store.loggedInUser().email }}</p>
    } @else {
      <p class="status">Guest session</p>
    }
  </header>

  <nav class="nav">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <section class="panel">
    <router-outlet></router-outlet>
  </section>
</main>
