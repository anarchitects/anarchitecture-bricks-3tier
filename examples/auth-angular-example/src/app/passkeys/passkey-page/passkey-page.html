<section class="anx-stack" aria-labelledby="passkey-heading">
  <h1 id="passkey-heading" class="text-2xl font-bold">Passkeys</h1>
  <p>Use your device to sign in without a password.</p>
  <p data-testid="session">
    @if (auth.restoring()) { Restoring your session… } @else if
    (auth.isLoggedIn()) { Signed in as {{ auth.loggedInUser()?.email }} } @else
    { Signed out }
  </p>
  <anarchitects-auth-passkeys
    [mode]="auth.isLoggedIn() ? 'enroll' : 'sign-in'"
    [enrollmentOptions]="{ name: 'This device' }"
  >
    <a passkeyFallback routerLink="/login">Use password sign-in</a>
  </anarchitects-auth-passkeys>
  @if (auth.isLoggedIn()) {
  <button
    class="anx-control px-4 py-2"
    type="button"
    [disabled]="auth.loading()"
    (click)="signOut()"
  >
    Sign out
  </button>
  }
</section>
